<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .block {
            height: 100px;
            width: 100px;
            border: 1px solid black;
        }
    </style>
    <script>
        function printName() {
            var name = prompt("Enter name")
            console.log("Hi ", name)
        }

        function printData1() {
            console.log("Mouse entered in div block")
        }
        function printData2() {
            console.log("Mouse left")
        }

    </script>
</head>

<body>
    <!-- Event binding -->
    <!-- <TAGNAME onevent="function()">Content</TAGNAME> -->
    <button onclick="printName()">CLick me</button>

    <div class="block" onclick="printName()" onmouseenter="printData1()" onmouseleave="printData2()">
        Hi
    </div>
    <!-- Enter num1: <input type="text"><br>
    ENter num2: <input type="text"><br>
    <button>Calculate</button> -->
</body>

</html>
