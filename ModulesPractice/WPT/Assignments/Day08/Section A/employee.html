<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Question 1</title>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .form-group { margin-bottom: 10px; }
        label { display: inline-block; width: 100px; }
        button { margin-top: 10px; cursor: pointer; }
    </style>
    <script>
        class Employee {
            #name = "";
            #email = "";
            #salary = 0;
            #department = "";

            constructor(name, email, salary, department) {
                this.name = name; 
                this.email = email;
                this.salary = salary;
                this.department = department;
            }

            calculateTax() {
                return 0.1 * this.#salary;
            }

            get name() { 
                return this.#name; 
            }

            get email() { 
                return this.#email; 
            }

            get salary() { 
                return this.#salary; 
            }

            get department() { 
                return this.#department; 
            }

            set name(value) { 
                this.#name = value; 
            }

            set email(value) { 
                this.#email = value; 
            }

            set salary(value) { 
                this.#salary = parseFloat(value); 
            }

            set department(value) { 
                this.#department = value; 
            }
        }

        function createEmployee() {
            const name = document.getElementById("empName").value;
            const email = document.getElementById("empEmail").value;
            const salary = document.getElementById("empSalary").value;
            const dept = document.getElementById("empDept").value;

            const emp = new Employee(name, email, salary, dept);
            
            console.log("New Employee Object:", emp);
            console.log("Calculated Tax:", emp.calculateTax());
        }

    </script>
</head>
<body>

    <h2>Employee Information</h2>
    <div class="form-group">
        <label>Name:</label>
        <input type="text" id="empName" placeholder="e.g. John Doe">
    </div>
    <div class="form-group">
        <label>Email:</label>
        <input type="email" id="empEmail" placeholder="john@example.com">
    </div>
    <div class="form-group">
        <label>Salary:</label>
        <input type="number" id="empSalary" placeholder="50000">
    </div>
    <div class="form-group">
        <label>Department:</label>
        <input type="text" id="empDept" placeholder="IT">
    </div>
    
    <button onclick="createEmployee()">Create and Check Console</button>
</body>
</html>
