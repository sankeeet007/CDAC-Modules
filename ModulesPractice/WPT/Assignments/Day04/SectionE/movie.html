<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Booking Table</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body { 
            background-color: #1a1a1a; 
            color: white; 
            padding-top: 50px; 
        }
        .container {
            background-color: #2d2d2d;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .table {
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 class="text-center mb-4 text-warning">Movie Collection</h2>
    
    <table class="table table-dark table-hover table-bordered border-secondary">
        <thead class="table-warning text-dark">
            <tr>
                <th>#</th>
                <th>Movie Name</th>
                <th>Price (Per Ticket)</th>
                <th>Seats Booked</th>
                <th>Total Cost</th>
            </tr>
        </thead>
        <tbody id="movie-table-body">
            </tbody>
    </table>
</div>

<script>
    let movies = [];

    for (let i = 1; i <= 3; i++) {
        let movieName, price, seats;

        while (true) {
            movieName = prompt(`[Movie ${i}] Enter Movie Name:`);
            if (movieName && movieName.trim().length > 0) break;
            alert("Please enter a valid movie name.");
        }

        while (true) {
            price = prompt(`[Movie ${i}] Enter Ticket Price:`);
            if (price && !isNaN(price) && parseFloat(price) > 0) {
                price = parseFloat(price);
                break;
            }
            alert("Invalid Price! Please enter a positive number.");
        }

        while (true) {
            seats = prompt(`[Movie ${i}] Enter Number of Seats:`);
            if (seats && !isNaN(seats) && parseInt(seats) > 0) {
                seats = parseInt(seats);
                break;
            }
            alert("Invalid Seats! Please enter at least 1 seat.");
        }

        movies.push({
            name: movieName,
            price: price,
            seats: seats,
            total: (price * seats)
        });
    }

    const tableBody = document.getElementById('movie-table-body');
    
    movies.forEach((movie, index) => {
        let row = `
            <tr>
                <td>${index + 1}</td>
                <td><strong>${movie.name}</strong></td>
                <td>$${movie.price.toFixed(2)}</td>
                <td>${movie.seats}</td>
                <td class="text-warning font-monospace">$${movie.total.toFixed(2)}</td>
            </tr>`;
        tableBody.innerHTML += row;
    });

</script>

</body>
</html>
