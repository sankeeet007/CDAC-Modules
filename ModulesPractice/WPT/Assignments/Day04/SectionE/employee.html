<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validated Employee Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 50px; }
        .table-container { background: #fff; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .header-title { color: #2c3e50; font-weight: bold; margin-bottom: 1.5rem; }
    </style>
</head>
<body>

    <div class="container table-container">
        <h2 class="text-center header-title">Employee Directory (Validated)</h2>
        <table class="table table-hover align-middle">
            <thead class="table-primary">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Phone</th>
                    <th>Salary</th>
                </tr>
            </thead>
            <tbody id="employee-table-body">
                </tbody>
        </table>
    </div>

    <script>
        let employees = [];

        for (let i = 1; i <= 3; i++) {
            let id, name, phone, salary;

            while (true) {
                id = prompt(`[Employee ${i}] Enter ID (Numbers only):`);
                if (id && !isNaN(id)) break;
                alert("Invalid ID! Please enter a numeric ID.");
            }

            while (true) {
                name = prompt(`[Employee ${i}] Enter Full Name:`);
                if (name && name.length >= 2 && isNaN(name)) break;
                alert("Invalid Name! Please enter a valid name (at least 2 letters).");
            }

            while (true) {
                phone = prompt(`[Employee ${i}] Enter Phone (10 digits):`);
                let phonePattern = /^\d{10}$/;
                if (phonePattern.test(phone)) break;
                alert("Invalid Phone! Please enter exactly 10 digits.");
            }

            while (true) {
                salary = prompt(`[Employee ${i}] Enter Salary:`);
                if (salary && !isNaN(salary) && parseFloat(salary) > 0) break;
                alert("Invalid Salary! Please enter a positive number.");
            }

            employees.push({ id, name, phone, salary });
        }

        const tableBody = document.getElementById('employee-table-body');
        employees.forEach(emp => {
            let row = `<tr>
                <td><strong>#${emp.id}</strong></td>
                <td>${emp.name}</td>
                <td>${emp.phone}</td>
                <td class="text-success">$${parseFloat(emp.salary).toLocaleString()}</td>
            </tr>`;
            tableBody.innerHTML += row;
        });
    </script>
</body>
</html>
