<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 2</title>
    <script>
        let noofele = prompt("No. of elements: ")
        var arr = []

        for(var i = 0; i < noofele; i++){
            let ele = prompt("Enter element: ")
            arr.push(ele);
        }
        
        let sum = 0
        for(var i = 0; i < arr.length; i++){
            sum=sum+Number(arr[i])
        }
    
        document.write("Addition of sequence is: "+sum)

    </script>
</head>

</body>
</html>
