<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 2</title>
    <script>
        let str = prompt("Enter Comma saperated numbers: ")
        var len = str.length

        let sum = 0
        for(var i = 0; i < len; i++){

            if(str.charAt(i) !== ','){
                sum = sum + Number(str.charAt(i))
            }
        }
            
        document.write("Addition of sequence is: "+sum)

    </script>
