<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 2</title>
    <script>
        let str = prompt("Enter a string: ");

        let result = isPalindrome(str)
        document.write("Is a Palindrome: "+result)

        function isPalindrome(str) {
            let i = 0;
            let j = str.length - 1;

            while (i < j) {
                if (str[i] !== str[j]) {
                    return false
                }
                i++;
                j--;
            }
            
          return true
        }

    </script>
