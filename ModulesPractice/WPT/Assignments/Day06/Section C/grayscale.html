<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Bootstrap - Grayscale</title>
    <style>
        /* Applying the rounded font globally */
        body {
            font-family: 'Varela Round', sans-serif;
        }

        /* Customizing the main title to feel smoother */
        .title-grayscale {
            letter-spacing: 0.8rem;
            font-size: calc(2rem + 5vw);
            /* Smooth text edges */
            -webkit-font-smoothing: antialiased;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
</head>
<body>

    <div class="vh-100 d-flex flex-column text-white" 
         style="background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.7) 100%), 
                url('https://startbootstrap.github.io/startbootstrap-grayscale/assets/img/bg-masthead.jpg'); 
                background-size: cover; background-position: center; background-attachment: fixed;">
        
        <nav class="navbar navbar-expand-lg navbar-dark pt-4 container">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold text-white-50" href="#">Start Bootstrap</a>
                <div class="d-flex gap-4 ms-auto">
                    <a href="#" class="nav-link text-white-50 small text-uppercase">About</a>
                    <a href="#" class="nav-link text-white-50 small text-uppercase">Projects</a>
                    <a href="#" class="nav-link text-white-50 small text-uppercase">Contact</a>
                </div>
            </div>
        </nav>

        <div class="container my-auto text-center">
            <h1 class="display-1 fw-bold text-uppercase mb-0 text-white-50" 
                style="letter-spacing: 0.8rem; font-size: calc(2rem + 5vw); filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));">
                Grayscale
            </h1>
            
            <p class="mx-auto text-white-50 mt-4 fs-5" style="max-width: 500px; line-height: 1.6;">
                A free, responsive, one page Bootstrap theme created by Start Bootstrap.
            </p>
            
            <div class="mt-5">
                <a href="#" class="btn btn-lg px-4 py-3 text-white text-uppercase fw-bold rounded-1" 
                   style="background-color: #64a19d; border: none; font-size: 0.85rem; letter-spacing: 0.15rem;">
                    Get Started
                </a>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
