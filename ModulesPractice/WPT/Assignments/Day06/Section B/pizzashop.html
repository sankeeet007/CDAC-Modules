<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Shop 2.0</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        table {
            font-size: 18px;
            margin-bottom: 20px;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border: 1px solid black;
        }

        .title-header {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            background-color: #f2f2f2;
        }

        input[type="text"], select, textarea {
            width: 95%;
            padding: 5px;
            font-size: 16px;
        }

        textarea {
            height: 80px;
            resize: vertical;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #e7e7e7;
            border: 1px solid #000;
        }

        button:hover {
            background-color: #ddd;
        }

        #resultTable {
            margin-top: 30px;
            width: 100%;
            border-collapse: collapse;
        }

        #resultTable th {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>

<body>

    <table border="1" width="600px" align="center">
        <tr>
            <th colspan="2" class="title-header">Pizza Shop 2.0</th>
        </tr>

        <tr>
            <td width="30%">Name</td>
            <td><input type="text" id="pizzaName"></td>
        </tr>

        <tr>
            <td>Pizza Topping</td>
            <td>
                <input type="radio" id="supreme" name="topping" value="supreme">
                <label for="supreme">Supreme</label><br>
                <input type="radio" id="vegetarian" name="topping" value="vegetarian">
                <label for="vegetarian">Vegetarian</label><br>
                <input type="radio" id="hawaiian" name="topping" value="hawaiian">
                <label for="hawaiian">Hawaiian</label>
            </td>
        </tr>

        <tr>
            <td>Pizza Sauce</td>
            <td>
                <select id="sauce">
                    <option value="tomato">Tomato</option>
                    <option value="bbq">BBQ</option>
                    <option value="garlic">Garlic</option>
                </select>
            </td>
        </tr>

        <tr>
            <td>Optional Extras</td>
            <td>
                <input type="checkbox" name="extras" value="Extra Cheese">
                <label>Extra Cheese</label>
                <input type="checkbox" name="extras" value="Gluten Free Base">
                <label>Gluten Free Base</label>
            </td>
        </tr>

        <tr>
            <td colspan="2">
                Delivery Instructions:<br><br>
                <textarea id="instructions"></textarea>
            </td>
        </tr>

        <tr>
            <td colspan="2">
                <button type="button" onclick="save()">Send my Order</button>
            </td>
        </tr>
    </table>

    <h3 style="text-align:center;">Order History</h3>
    <table id="resultTable" border="1">
        <thead>
            <tr>
                <th>Customer Name</th>
                <th>Topping</th>
                <th>Sauce</th>
                <th>Extras</th>
                <th>Instructions</th>
            </tr>
        </thead>
        <tbody id="tablebody">
            </tbody>
    </table>

    <script>
        var pizzaOrders = [];

        function save() {
            var pname = document.getElementById("pizzaName").value;
            var psauce = document.getElementById("sauce").value;
            var instructions = document.getElementById("instructions").value;

            var topping_doms = document.getElementsByName("topping");
            var topping = "";
            for (var i = 0; i < topping_doms.length; i++) {
                if (topping_doms[i].checked) {
                    topping = topping_doms[i].value;
                }
            }

            var extra_doms = document.getElementsByName("extras");
            var selected_extras = [];
            for (var i = 0; i < extra_doms.length; i++) {
                if (extra_doms[i].checked) {
                    selected_extras.push(extra_doms[i].value);
                }
            }

            if (pname.trim().length < 5) {
                alert("Validation Error: Name must be at least 5 characters long.");
                return; 
            }

            if (psauce === "tomato" && topping === "supreme") {
                alert("Validation Error: You cannot select Supreme topping with Tomato sauce.");
                return;
            }

            var words = instructions.trim().split(/\s+/).filter(function(w) { return w.length > 0; });
            if (words.length < 5) {
                alert("Validation Error: Delivery instructions must have at least 5 words.");
                return;
            }

            var newOrder = {
                customerName: pname,
                pizzaTopping: topping || "None Selected",
                pizzaSauce: psauce,
                extras: selected_extras.join(", ") || "None",
                deliveryNotes: instructions
            };

            pizzaOrders.push(newOrder);
            display();
            
            document.getElementById("pizzaName").value = "";
            document.getElementById("instructions").value = "";
        }

        function display() {
            var htmlStr = "";
            for (var i = 0; i < pizzaOrders.length; i++) {
                htmlStr += "<tr>" +
                            "<td>" + pizzaOrders[i].customerName + "</td>" +
                            "<td>" + pizzaOrders[i].pizzaTopping + "</td>" +
                            "<td>" + pizzaOrders[i].pizzaSauce + "</td>" +
                            "<td>" + pizzaOrders[i].extras + "</td>" +
                            "<td>" + pizzaOrders[i].deliveryNotes + "</td>" +
                           "</tr>";
            }
            document.getElementById("tablebody").innerHTML = htmlStr;
        }
    </script>
</body>

</html>
