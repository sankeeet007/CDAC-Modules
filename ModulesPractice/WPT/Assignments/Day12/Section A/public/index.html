<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script>
        $(document).ready(function() {
            $('#regForm').on('submit', function(e) {
                e.preventDefault();

                const rawArray = $(this).serializeArray();
                const formData = {};
                const languages = [];

                $.map(rawArray, function(item) {
                    if(item.name === 'lang'){
                        languages.push(item.value);
                    }
                    else{
                        formData[item.name] =item.value;
                    }
                });
                formData.languages = languages;

                $.ajax({
                    url : '/server',
                    type : 'POST',
                    contentType : 'application/json',
                    data : JSON.stringify(formData),
                    success : function(response){
                        alert(response);
                    },
                    error : function() {
                        alert("Error sending data");
                    }
                });
            });
        });
    </script>
</head>

<body class="bg-light">

    <div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 shadow p-4 bg-white rounded">
            <h2 class="mb-4 text-center">Register</h2>
            <form id="regForm">
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Date of Birth</label>
                    <input type="date" name="dob" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone</label>
                    <input type="tel" name="phone" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label d-block">Gender</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" value="Male" required>
                        <label class="form-check-label">Male</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" value="Female">
                        <label class="form-check-label">Female</label>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label d-block">Language</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" name="lang" value="English">
                        <label class="form-check-label">English</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" name="lang" value="Marathi">
                        <label class="form-check-label">Marathi</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" name="lang" value="Hindi">
                        <label class="form-check-label">Hindi</label>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">State</label>
                    <select name="state" class="form-select" required>
                        <option value="" selected disabled>Choose...</option>
                        <option value="MH">Maharashtra</option>
                        <option value="KT">Karnataka</option>
                        <option value="UP">Uttar Pradesh</option>
                        <option value="MP">Madhya Pradesh</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary w-100">Submit</button>
            </form>
        </div>
    </div>
    </div>

</body>
</html>
