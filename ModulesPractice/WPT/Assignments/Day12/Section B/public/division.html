<!DOCTYPE html>
<html>
<head>
    <title>Division</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="container mt-5">
    <div class="card p-4 mx-auto" style="max-width: 400px;">
        <h3>Division (/)</h3>
        <input type="number" id="num1" class="form-control mb-2" placeholder="Number 1">
        <input type="number" id="num2" class="form-control mb-2" placeholder="Number 2">
        <button id="btn" class="btn btn-primary">Divide</button>
        <h4 class="mt-3">Result: <span id="res">--</span></h4>
    </div>

    <script>
        $('#btn').click(function() {
            $.ajax({
                url: '/server',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    num1: $('#num1').val(),
                    num2: $('#num2').val(),
                    operation: 'divide' 
                }),
                success: function(data) {
                    $('#res').text(data.result);
                }
            });
        });
    </script>
</body>
</html>
