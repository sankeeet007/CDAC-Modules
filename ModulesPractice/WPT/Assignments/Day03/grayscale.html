<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body, html{
            height: 100%;
            background-color: #000;
        }
        .navbar{
            display: flex;
            padding: 20px 50px;
            background: transparent;
            position: fixed;
            width: 100%;
            z-index: 10;
        }
        .logo{
            color: white;
            font-weight: bold;
            text-transform: uppercase;
            flex-grow: 1;
        }
        .nav-links{
            list-style: none;
            display: flex;
        }
        .nav-links li{
            margin-left: 20px;
        }
        .nav-links a{
            text-decoration: none;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            text-transform: uppercase;
        }
        .masthead{
            height: 100vh;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('./images/grayscale-mountain.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: center;
        }
        .brand-heading{
            font-size: 5rem;
            margin-bottom: 10px;
            letter-spacing: 15px;
        }
        .intro-text{
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
            max-width: 500px;
            margin: 0 auto 30px;
        }
        .btn{
            display: inline-block;
            padding: 15px 30px;
            background-color: #64a19d;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        .btn-hover{
            background-color: #4e827f;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="logo">Start Bootstrap</div>
        <ul class="nav-links">
            <li><a href="#">About</a></li>
            <li><a href="#">Projects</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <header class="masthead">
        <div class="container">
            <h1 class="brand-heading">GRAYSCALE</h1>
            <p class="intro-text">A free, responsive, one page Bootstrap theme created by Start Bootstrap.</p>
            <a href="#" class="btn">GET STARTED</a>
        </div>
    </header>
</body>
</html>
