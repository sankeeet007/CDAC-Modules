<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 1</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"
        integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <style>
        .block {
            height: 100px;
            width: 100px;
            border: 1px solid black;
            background-color: blueviolet;
        }

        .error {
            color: red;
            background-color: grey;
            border: 3px solid red;
        }
    </style>
    <script>
        $(document).ready(function () {
            $("#show").click(function () {
                $(".block").show()
            })
            $("#hide").click(function () {
                $(".block").hide()
            })
            $("#toggle").click(function () {
                $(".block").toggle()
            })

            $("#fadeinbtn").click(function () {
                $(".block").fadeIn(2000, 'linear')
            })
            $("#fadeoutbtn").click(function () {
                $(".block").fadeOut(2000, 'linear')
            })
            $("#fadetogglebtn").click(function () {
                $(".block").fadeToggle(2000, 'linear')
            })
             $("#slidetogglebtn").click(function () {
                $(".block").slideToggle(2000, 'linear')
            })

            //animate function works on css property with measurement unit
            $(".block").mouseover(function () {
                $(".block").animate({ height: '+=100px', width: '+=100px', marginLeft: '300px' }, 3000, 'linear', function () {
                    $(".block").animate({ height: "-=100px", width: "-=100px" }, 2000)
                })
            })

        })

    </script>
</head>

<body>
    <div class="block">
        hi
    </div>
    <button id="show">Show</button>
    <button id="hide">Hide</button>
    <button id="toggle">Toggle</button>
    <button id="fadeinbtn">Fade in</button>
    <button id="fadeoutbtn">Fade out</button>
    <button id="fadetogglebtn">fade toggle</button>
    <button id="slidetogglebtn">slide toggle</button>

</body>

</html>
