<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Question 2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow">
                <div class="card-header bg-dark text-white text-center py-3">
                    <h5 class="mb-0">Enter Movie Details</h5>
                </div>
                <div class="card-body p-4">
                    <form id="movieForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Movie Name</label>
                            <input type="text" id="movieName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Actor Name</label>
                            <input type="text" id="actorName" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Release Date</label>
                            <input type="datetime-local" id="releaseDate" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Movie Type</label>
                            <input type="checkbox" class="movieType" name="movieType" value="2d">2D
                            <input type="checkbox" class="movieType" name="movieType" value="3d">3D
                            <input type="checkbox" class="movieType" name="movieType" value="imax">IMAX
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Language</label>
                            <input type="radio" class="language" name="language" value="English">English
                            <input type="radio" class="language" name="language" value="Hindi">Hindi
                            <input type="radio" class="language" id="language" value="Marathi">Marathi
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Add to Table</button>
                    </form>
                </div>
            </div>
        </div>

        <div class="col-md-7">
            <div class="card border-0 shadow">
                <div class="card-header bg-primary text-white text-center py-3">
                    <h5 class="mb-0">Movie Database</h5>
                </div>
                <div class="card-body">
                    <table class="table table-hover mt-2" id="movieTable">
                        <thead class="table-light">
                            <tr>
                                <th>#</th>
                                <th>Movie Name</th>
                                <th>Actor Name</th>
                                <th>Release Date</th>
                                <th>Movie Type</th>
                                <th>Language</th>
                            </tr>
                        </thead>
                        <tbody>
                            </tbody>
                    </table>
                    <div id="emptyMsg" class="text-center text-muted py-3">
                        No movies added yet.
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        let movieCount = 0;

        $('#movieForm').on('submit', function(e) {
            e.preventDefault(); 
            
            $('#emptyMsg').hide();

            const movieName = $('#movieName').val();
            const actorName = $('#actorName').val();
            const releaseDate = $('#releaseDate').val();
            const movieType = []
            $(".movieType:checked").each(function(){
                movieType.push($(this).val())
            })

            const language = $(".language:checked").val()

            movieCount++;

            const row = `
                <tr>
                    <td>${movieCount}</td>
                    <td><strong>${movieName}</strong></td>
                    <td><strong>${actorName}</strong></td>
                    <td>${new Date(releaseDate).toLocaleString()}</td>
                    <td><span class="badge bg-secondary">${movieTypes.join(", ")}</span></td>
                    <td><strong>${language}</strong></td>
                </tr>`;

            $('#movieTable tbody').append(row);

            this.reset();
            $('#movieName').focus();
        });
    });
</script>

</body>
</html>
