<script>
    let taskList = []
    
    function addTask(){
        var name = $("#name").val()
        var desc = $("#desc").val()
        var date = $("#date").val()
        var status = $("#status").val()

        if(!name) 
            return alert("Please enter a task name")

        const newTask = {
            id: Date.now(),
            name,
            desc,
            date,
            status
        };

        taskList.push($(newTask).val())
        renderTasks()
        clearInputs()
    }

    function deleteTask(){
        taskList = taskList.filter(task => task.id !== id)
        renderTasks()
    }
</script>
